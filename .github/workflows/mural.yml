# Publica o mural de mensagens (Cloudflare Worker) quando mural/ muda.
# Precisa dos segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID; sem eles, só avisa e termina sem erro.
name: mural
on:
  push:
    branches: [main]
    paths: ['mural/**', '.github/workflows/mural.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: mural, cancel-in-progress: false }
jobs:
  publica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Segredos presentes?
        id: s
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "::warning::Faltam os segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID; nada publicado."; fi
      - uses: actions/checkout@v4
        if: steps.s.outputs.ok == '1'
      - uses: actions/setup-node@v4
        if: steps.s.outputs.ok == '1'
        with: { node-version: 22 }
      - name: Publica o worker do mural
        if: steps.s.outputs.ok == '1'
        working-directory: mural
        run: npx --yes wrangler@4.152.0 deploy
      - name: Mural respondendo?
        if: steps.s.outputs.ok == '1'
        run: curl -fsS --retry 12 --retry-delay 10 --retry-all-errors https://apuracao-mural.leandrohgmafra.workers.dev/mural && echo " (mural respondendo)"
